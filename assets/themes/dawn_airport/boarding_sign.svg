<svg xmlns="http://www.w3.org/2000/svg" width="288" height="140" viewBox="0 0 144 70">
  <defs>
    <linearGradient id="rim" x2=".25" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f5ddc1"/>
      <stop offset=".48" stop-color="#c5b5b2"/>
      <stop offset="1" stop-color="#a39eae"/>
    </linearGradient>
    <linearGradient id="post">
      <stop stop-color="#76778a"/>
      <stop offset=".42" stop-color="#c9b9b5"/>
      <stop offset="1" stop-color="#868495"/>
    </linearGradient>
  </defs>

  <!-- Sign housing and pedestal, drawn behind the moving leaves. -->
  <rect x="21" y="31" width="6" height="37" rx="1" fill="url(#post)"/>
  <rect x="16" y="66" width="16" height="3.5" rx="1.5" fill="#868496"/>
  <rect x=".75" y="1.25" width="46.5" height="33.5" rx="4.5" fill="url(#rim)" stroke="#777584" stroke-width="1.5"/>
  <rect x="3" y="4" width="42" height="28" rx="2.5" fill="#414454"/>
  <path d="M1 17h2m42 0h2" stroke="#8c8290" stroke-width="2"/>

  <!-- Waiting face, with a departure pictogram. -->
  <g transform="translate(52 5)">
    <rect width="40" height="26" rx="1.5" fill="#46566d"/>
    <path d="M0 13h40v11.5q0 1.5-1.5 1.5h-37Q0 26 0 24.5Z" fill="#39485e"/>
    <path d="M20 2c1 0 1.5 1.2 1.5 2.8v4.5l8 6v2.2l-8-3.3v5l2.6 2.1v1.6L20 21.6l-4.1 1.3v-1.6l2.6-2.1v-5l-8 3.3v-2.2l8-6V4.8C18.5 3.2 19 2 20 2Z" transform="rotate(28 20 13)" fill="#e1e3dc"/>
  </g>

  <!-- Saved face. The tip of the check spans the hinge. -->
  <g transform="translate(100 5)">
    <rect width="40" height="26" rx="1.5" fill="#494958"/>
    <path d="M0 13h40v11.5q0 1.5-1.5 1.5h-37Q0 26 0 24.5Z" fill="#3c3c49"/>
    <path d="m10.5 13.5 6 6L29.5 7" fill="none" stroke="#ffdb91" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
